<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>AI 챗봇 - GoodsBridge 뷰단 목업</title>
<link rel="stylesheet" href="css/style.css">
<style>
.chatbox { background:#fff; border:1px solid #e3e5ea; border-radius:8px; padding:14px; min-height:300px; max-height:420px; overflow-y:auto; margin-bottom:10px; }
.msg { margin-bottom:10px; max-width:80%; padding:8px 12px; border-radius:10px; font-size:13px; line-height:1.4; }
.msg.user { background:#3b5bdb; color:#fff; margin-left:auto; text-align:right; }
.msg.assistant { background:#eef0f5; color:#222; }
.msg.tool { background:#fff3bf; color:#664d03; font-family:Consolas,monospace; font-size:11px; }
</style>
</head>
<body>
<div id="nav"></div>
<main>
  <div class="page-title"><h1>AI 에이전트 (POST /api/chat)</h1></div>
  <div id="issueBadges"></div>
  <p class="muted">Spring AI + Gemini function calling을 흉내낸 규칙기반 목업입니다. 아래 예시 문장을 눌러보거나 직접 입력하세요.</p>

  <div class="row" style="margin-bottom:10px">
    <button class="btn secondary" onclick="send('내 교환 현황 알려줘')">예시: 내 교환 현황 알려줘</button>
    <button class="btn secondary" onclick="send('내 이벤트 참가내역 알려줘')">예시: 내 이벤트 참가내역</button>
    <button class="btn secondary" onclick="send('근처에 포토카드 파는 가게 있어?')">예시: 근처 가게 찾기</button>
    <button class="btn secondary" onclick="send('이 교환 취소해줘')">예시: 교환 취소해줘 (쓰기액션)</button>
  </div>

  <div class="chatbox" id="chatbox"></div>
  <div class="row">
    <input id="chatInput" placeholder="메시지를 입력하세요" style="flex:1;margin-bottom:0" onkeydown="if(event.key==='Enter')sendFromInput()">
    <button class="btn" onclick="sendFromInput()">전송</button>
  </div>
</main>
<script src="js/app.js"></script>
<script>
mountCommon('chat.html');
document.getElementById('issueBadges').innerHTML = renderIssueBadges([13], 'POST /api/chat, tool calling (서비스 계층 직접호출)');

function pushLog(role, content) {
  const db = loadDB();
  db.chatLogs.push({ id: nextId(db, 'chatLogs'), userId: currentUserId(), role, content, createdAt: new Date().toISOString() });
  saveDB(db);
}
function renderChat() {
  const db = loadDB();
  const mine = db.chatLogs.filter(c => c.userId === currentUserId());
  document.getElementById('chatbox').innerHTML = mine.length ? mine.map(c =>
    `<div class="msg ${c.role.toLowerCase()}">${c.content}</div>`
  ).join('') : '<div class="empty">대화가 없습니다. 위 예시를 눌러보세요.</div>';
  document.getElementById('chatbox').scrollTop = 999999;
}

function sendFromInput() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  send(text);
}

function send(text) {
  pushLog('USER', text);
  apiLog('POST', '/api/chat', `"${text}"`);
  renderChat();

  setTimeout(() => {
    const db = loadDB();
    const me = currentUserId();
    let toolNote = null, answer;

    if (text.includes('교환') && text.includes('취소')) {
      const req = db.exchangeRequests.find(r => (db.exchangeItems.find(e => e.id === r.exchangeItemBId)?.userId === me) && r.status === 'PENDING');
      toolNote = '🔧 tool: exchangeService.cancel(reqId) 호출 전 — 쓰기 액션이라 사용자 확인 필요';
      pushLog('TOOL', toolNote);
      renderChat();
      answer = req
        ? `교환 요청 #${req.id}를 취소할까요? 보증금은 100% 환불됩니다. ("네"라고 답하면 실제 서비스에서는 cancel() 메서드를 호출합니다 — 이 목업에서는 exchange.html에서 직접 눌러보세요)`
        : '취소 가능한 PENDING 상태의 교환 요청이 없어요. exchange.html에서 먼저 제안을 만들어보세요.';
    } else if (text.includes('교환') && text.includes('현황')) {
      const mine2 = db.exchangeRequests.filter(r => {
        const a = db.exchangeItems.find(e => e.id === r.exchangeItemAId);
        const b = db.exchangeItems.find(e => e.id === r.exchangeItemBId);
        return (a && a.userId === me) || (b && b.userId === me);
      });
      toolNote = `🔧 tool: exchangeService.getMyRequests(userId=${me}) 조회 — GET /api/exchange-requests/me 대응`;
      pushLog('TOOL', toolNote);
      renderChat();
      answer = mine2.length ? `현재 교환 ${mine2.length}건: ` + mine2.map(r => `#${r.id}(${r.status})`).join(', ') : '진행중인 교환이 없어요.';
    } else if (text.includes('이벤트')) {
      const mine2 = db.eventParticipations.filter(p => p.userId === me);
      toolNote = `🔧 tool: eventService.getMyParticipations(userId=${me}) 조회 — GET /api/events/me 대응`;
      pushLog('TOOL', toolNote);
      renderChat();
      answer = mine2.length ? `참가중인 이벤트 ${mine2.length}건, 번호표: ` + mine2.map(p => p.ticketNumber).join(', ') : '참가한 이벤트가 없어요.';
    } else if (text.includes('가게') || text.includes('근처')) {
      const shops = db.shops.filter(s => s.status === 'APPROVED');
      toolNote = '🔧 tool: shopService.search(region, category) 조회 — GET /api/shops 대응';
      pushLog('TOOL', toolNote);
      renderChat();
      answer = shops.length ? '이런 가게가 있어요: ' + shops.map(s => s.name).join(', ') : '등록된 가게가 없어요.';
    } else {
      answer = '일반 대화로 처리했어요 (tool 호출 없음). 교환/이벤트/가게 관련 질문을 해보세요.';
    }
    pushLog('ASSISTANT', answer);
    renderChat();
  }, 400);
}
renderChat();
</script>
</body>
</html>
