plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.GoodsBridge'
version = '0.0.1-SNAPSHOT'
description = 'GoodsBridge'

ext {
    springAiVersion = '2.0.1'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencyManagement {
    imports {
        mavenBom "org.springframework.ai:spring-ai-bom:${springAiVersion}"
    }
}

dependencies {

    implementation group: 'org.apache.commons', name: 'commons-lang3', version: '3.18.0'

    // H2 Database (테스트용 내장 DB)
    runtimeOnly 'com.h2database:h2'

    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-mustache'
    implementation 'org.springframework.ai:spring-ai-starter-model-google-genai'
    implementation 'me.paulschwarz:springboot4-dotenv:5.1.0'
    compileOnly 'org.projectlombok:lombok'
    developmentOnly 'org.springframework.boot:spring-boot-devtools'
    runtimeOnly 'com.mysql:mysql-connector-j'
    annotationProcessor 'org.projectlombok:lombok'
    testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testCompileOnly 'org.projectlombok:lombok'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
    useJUnitPlatform()

    // Windows에서 사용자 홈 경로(및 그 하위 프로젝트 경로)에 비ASCII 문자가 있으면
    // Mockito의 inline mock maker가 bytebuddy 에이전트를 로드하지 못해 모든 테스트가 깨짐.
    // 그 경우에만 OS 드라이브 루트의 영문 경로로 우회 (해당 없는 환경은 기본값 그대로 사용)
    def defaultTmp = System.getProperty('java.io.tmpdir')
    def isWindows = System.getProperty('os.name').toLowerCase().contains('windows')
    if (isWindows && defaultTmp != null && !defaultTmp.matches('^[\\x00-\\x7F]*$')) {
        def asciiTmpDir = new File("${System.getenv('SystemDrive') ?: 'C:'}/gradle-test-tmp")
        asciiTmpDir.mkdirs()
        systemProperty 'java.io.tmpdir', asciiTmpDir.absolutePath
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}
