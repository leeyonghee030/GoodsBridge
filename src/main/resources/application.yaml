
spring:
    config:
        import: optional:file:.env[.properties]

    application:
        name: GoodsBridge

    datasource:
        url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:goodsbridge}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&useUnicode=true
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver

    # 이미지 업로드 크기 제한 (기본 1MB라 휴대폰 사진이 막혀서 상향)
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB

    jpa:
        hibernate:
            ddl-auto: ${JPA_DDL_AUTO:update}
        open-in-view: false

    ai:
        google:
            genai:
                api-key: ${GEMINI_API_KEY}
                chat:
                    model: gemini-2.5-flash

    # 메일 발송 설정 (추가)
    mail:
        host: smtp.gmail.com        # Gmail SMTP 서버 주소
        port: 587                   # STARTTLS 포트
        username: ${MAIL_USERNAME:}  # 발신 Gmail 주소 (.env)
        password: ${MAIL_PASSWORD:}  # 16자리 앱 비밀번호 (.env, 구글 로그인 비밀번호 아님)
        properties:
            mail:
                smtp:
                    auth: true                # SMTP 서버에 아이디, 비밀번호로 로그인
                    starttls:
                        enable: true            # 암호화 연결(TLS)로 전환
                        required: true          # 전환에 실패하면 보내지 않음
                    connectiontimeout: 5000   # 서버 연결을 기다리는 최대 시간 (밀리초)
                    timeout: 5000             # 서버 응답을 기다리는 최대 시간 (밀리초)
                    writetimeout: 5000        # 데이터를 보내는 데 걸리는 최대 시간 (밀리초)


oauth2:
    kakao:
        client-id: ${KAKAO_CLIENT_ID}
        client-secret: ${KAKAO_CLIENT_SECRET}
        redirect-uri: ${KAKAO_REDIRECT_URI}
        authorization-uri: https://kauth.kakao.com/oauth/authorize
        token-uri: https://kauth.kakao.com/oauth/token
        user-info-uri: https://kapi.kakao.com/v2/user/me

jwt:
    secret: ${JWT_SECRET}
    access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS}
    refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS}

portone:
    api-secret: ${PORTONE_API_SECRET}
    store-id: ${PORTONE_STORE_ID}
    channel-key: ${PORTONE_CHANNEL_KEY}

app:
    # 입점 신청 시 입력해야 하는 체인점 코드 (본사가 각 지점에 알려준다)
    chain-code: ${CHAIN_CODE:GB-CHAIN-2026}
    demo:
        enabled: ${APP_DEMO_ENABLED:false}
    notifications:
        test-endpoint-enabled: ${NOTIFICATION_TEST_ENABLED:false}
