spring:
    datasource:
        url: jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
        driver-class-name: org.h2.Driver
        username: sa
        password:
    jpa:
        hibernate:
            ddl-auto: create-drop
        show-sql: true
        properties:
            hibernate:
                format_sql: true
        defer-datasource-initialization: true # ⭐ JPA 테이블 생성 후 data.sql 실행 보장
    sql:
        init:
            mode: always # 항상 data.sql 실행

# 💡 PortOne 테스트용 가짜 설정값 추가 (Placeholder 에러 방지)
portone:
    channel-key: test-channel-key
    api-key: test-api-key
    api-secret: test-api-secret


