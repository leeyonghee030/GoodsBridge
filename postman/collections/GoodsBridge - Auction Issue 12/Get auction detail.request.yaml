$kind: http-request
url: "{{baseUrl}}/api/auctions/{{auctionId}}"
method: GET
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('detail returned', function () { pm.response.to.have.status(200); });
      pm.expect(pm.response.json().id).to.eql(Number(pm.collectionVariables.get('auctionId')));
    language: text/javascript
order: 3000
